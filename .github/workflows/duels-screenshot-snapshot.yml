# Temporary, branch-restricted workflow: remove after generated images are reviewed.
# No workflow file is retained on main. It commits only two browser-tested
# image assets to the exact feature branch, never to the default branch.
name: Capture verified Duels screenshots to feature branch
on:
  push:
    branches:
      - docs/v012-verified-duels-readme-20261116
    paths:
      - .github/workflows/duels-screenshot-snapshot.yml
permissions:
  contents: write
jobs:
  capture:
    if: github.repository == 'MasynNay/aftertone' && github.ref == 'refs/heads/docs/v012-verified-duels-readme-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact screenshot branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test actual public site
        run: npm run check
      - name: Install browser and image encoder
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Exercise real Duels bracket and podium with fictional tracks
        run: python scripts/browser-smoke.py
      - name: Convert approved fixture browser captures to WebP
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          sources = {
              'music-duels-bracket-1440x900.png': 'app-music-duels-bracket.webp',
              'music-duels-complete-1440x900.png': 'app-music-duels-podium.webp'
          }
          outdir = Path('docs/screenshots')
          outdir.mkdir(parents=True, exist_ok=True)
          for src, name in sources.items():
              p = Path('browser-smoke-artifacts') / src
              if not p.is_file():
                  raise RuntimeError('Missing verified browser capture: '+str(p))
              with Image.open(p) as raw:
                  if raw.format != 'PNG' or raw.width != 1440 or raw.height < 900:
                      raise RuntimeError('Unexpected screenshot dimensions or type: '+str(p))
                  im = raw.convert('RGB')
              im.thumbnail((1280, 4096), Image.Resampling.LANCZOS)
              target=outdir / name
              im.save(target, format='WEBP', quality=77, method=6)
              if target.stat().st_size < 15000:
                  raise RuntimeError('Generated image unexpectedly small: '+str(target))
              print(f'Generated {target}: {im.width}x{im.height} {target.stat().st_size} bytes')
          PY
      - name: Commit only two reviewed fixture screenshot assets
        env:
          TARGET_BRANCH: docs/v012-verified-duels-readme-20261116
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/screenshots/app-music-duels-bracket.webp docs/screenshots/app-music-duels-podium.webp
          git diff --cached --quiet && { echo 'No new snapshot images'; exit 1; }
          git commit -m 'docs: store verified Duels bracket and podium screenshots'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
