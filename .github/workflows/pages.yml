name: Verify and deploy AFTERTONE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run automated checks and build the public site
        run: npm run check
      - name: Set up Python 3.12 for browser testing
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Browser binaries are large and change with the pinned Playwright
      # release. Cache exactly that revision; never restore a mismatched one.
      # System libraries are still installed on each fresh runner.
      - name: Cache pinned Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-1.56.0
      - name: Install Playwright, Chromium and Firefox
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium firefox
      - name: Smoke-test the actual homepage and app in Chromium
        run: python scripts/browser-smoke.py
        env:
          AFTERTONE_VISUAL_REVIEW: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      - name: Smoke-test Firefox homepage, app navigation and keyboard access
        run: python scripts/browser-smoke.py --firefox
      - name: Upload verified product screenshots for PR review
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aftertone-ui-evidence
          path: |
            browser-smoke-artifacts/portfolio-1440x900.png
            browser-smoke-artifacts/discover-1440x900.png
            browser-smoke-artifacts/duels-1440x900.png
            browser-smoke-artifacts/music-duels-bracket-1440x900.png
            browser-smoke-artifacts/music-duels-complete-1440x900.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aftertone-browser-debug
          path: browser-smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: test-and-build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
